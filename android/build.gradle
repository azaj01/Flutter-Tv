allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep build output in the project-level `build/` directory, as the Flutter
// tooling expects. Uses the Gradle 8 layout API; `rootProject.buildDir` is
// deprecated and removed in Gradle 9.
rootProject.layout.buildDirectory.set(file("../build"))

subprojects {
    project.layout.buildDirectory
        .set(rootProject.layout.buildDirectory.get().dir(project.name))
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
